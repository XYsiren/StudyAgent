name: rag-knowledge-assistant

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: rag-knowledge-assistant-backend:local
  restart: unless-stopped
  environment: &backend-env
    RAG_ENVIRONMENT: production
    RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/rag
    RAG_DATA_DIR: /app/data
    RAG_SECRET_KEY: ${RAG_SECRET_KEY:?Set RAG_SECRET_KEY}
    RAG_REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
    RAG_QDRANT_URL: http://qdrant:6333
    RAG_QDRANT_API_KEY: ${RAG_QDRANT_API_KEY:?Set RAG_QDRANT_API_KEY}
    RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-sentence-transformers}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-512}
    RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-}
    RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.openai.com/v1}
    RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-openai}
    RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
    RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
    RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
    RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-8}
    RAG_EMBEDDING_NUM_CTX: ${RAG_EMBEDDING_NUM_CTX:-4096}
    RAG_OLLAMA_NUM_CTX: ${RAG_OLLAMA_NUM_CTX:-16384}
    RAG_MODEL_TIMEOUT: ${RAG_MODEL_TIMEOUT:-240}
    RAG_MAX_OUTPUT_TOKENS: ${RAG_MAX_OUTPUT_TOKENS:-2048}
    RAG_QDRANT_COLLECTION_PREFIX: rag_assistant
    RAG_VISION_MODEL: ${RAG_VISION_MODEL:-}
    RAG_OCR_ENABLED: ${RAG_OCR_ENABLED:-true}
    HF_HOME: /app/data/models
  volumes:
    - app-data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${RAG_QDRANT_API_KEY:?Set RAG_QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
  api:
    <<: *backend
    ports:
      - 127.0.0.1:8010:8000
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    healthcheck:
      disable: true
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - 8080:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  app-data:
  postgres-data:
  redis-data:
  qdrant-data:
